<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JS 贪吃蛇</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>🐍 JavaScript 贪吃蛇</h1>
    <section class="panel">
      <div class="stats">
        <p>分数：<span id="score">0</span></p>
        <p>最高分：<span id="high-score">0</span></p>
      </div>
      <canvas id="game-canvas" width="400" height="400" aria-label="贪吃蛇游戏画布"></canvas>
      <div class="controls">
        <p>操作：方向键 / WASD</p>
        <button id="restart-btn" type="button">重新开始</button>
      </div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
